# 16 GB laptop: the template's 8G heap starved the OS (2.7 GB free during builds).
# 3G is plenty for this project's 11 Gradle subprojects.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# NOTE: org.gradle.configuration-cache is NOT enabled: the Flutter Gradle plugin
# (DependencyVersionChecker minSdk task) cannot be serialised into it (verified).
# keep the daemon alive across a working day (a cold daemon costs ~60 s per build)
org.gradle.daemon.idletimeout=28800000
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

name: battery_reader
description: Reads and displays all telemetry from a JoySuny BMS (Sphere / RV Battery) over BLE.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # #104: zip for the "Export all data" file.
  archive: ^4.0.0
  flutter_blue_plus: ^2.3.12 # BLE transport on iOS + Android
  # universal_ble is the Windows (WinRT) BLE backend. flutter_blue_plus has no
  # Windows support, so the transport layer (lib/ble_transport.dart) uses FBP on
  # mobile and universal_ble on Windows desktop.
  universal_ble: ^0.18.0
  sqflite: ^2.3.0 # on-device time-series store (SQLite) — mobile
  # sqflite has no desktop implementation; on Windows main() swaps in the FFI
  # factory (sqfliteFfiInit / databaseFactoryFfi) so the same schema opens there.
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0 # join() for the database path
  fl_chart: ^0.69.0 # line/area charts for the history screens
  # Verbose raw-log file (issue #19): path_provider resolves the per-platform
  # directory for the single append-only raw log (external files dir on Android,
  # app-support dir on desktop); share_plus provides the "Share raw log" action.
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  # Issue #27: durable fleet membership. The in-fleet serials are persisted here
  # so the fleet survives an app kill/restart and is re-applied to each pack as
  # it is (re)discovered (see lib/fleet_store.dart).
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.1
  flutter_foreground_task: ^11.0.3
  file_picker: ^13.1.0
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# App icon (#102): source is assets/branding/icon.svg, rendered to
# assets/icon.png (1024 px, no alpha). Regenerate with
# `dart run flutter_launcher_icons` after changing it.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
